<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리들의 놀이터</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <style>
        /* 기본 스타일 설정 */
        body { font-family: 'Pretendard', 'Malgun Gothic', sans-serif; margin: 0; padding: 0; background-color: #f4f7f6; color: #333; }
        header { background-color: #2c3e50; color: white; padding: 20px; text-align: center; }
        nav { display: flex; justify-content: center; gap: 15px; padding: 15px; background-color: #ecf0f1; }
        nav button { background-color: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; transition: background-color 0.2s; }
        nav button:hover { background-color: #2980b9; }

        .content-section { background: white; max-width: 600px; margin: 30px auto; padding: 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        .hidden { display: none !important; }

        .action-btn { background-color: #e74c3c; color: white; border: none; padding: 15px 30px; border-radius: 5px; cursor: pointer; font-size: 18px; font-weight: bold; margin-top: 20px; transition: background-color 0.2s; }
        .action-btn:hover { background-color: #c0392b; }
        .fortune-btn { background-color: #9b59b6; }
        .fortune-btn:hover { background-color: #8e44ad; }
        
        .btn-easy { background-color: #2ecc71; padding: 10px 20px; font-size: 16px; margin: 5px; }
        .btn-normal { background-color: #f39c12; padding: 10px 20px; font-size: 16px; margin: 5px; }
        .btn-hard { background-color: #8e44ad; padding: 10px 20px; font-size: 16px; margin: 5px; }
        
        #result { margin-top: 30px; font-size: 28px; font-weight: bold; color: #27ae60; }
        #fortuneResult { margin-top: 30px; }

        /* --- 리듬게임 스타일 --- */
        #gameArea {
            position: relative; width: 100%; max-width: 300px; height: 400px; background-color: #2c3e50;
            margin: 20px auto; border-radius: 10px; overflow: hidden; border: 4px solid #34495e;
            touch-action: none; cursor: pointer;
        }

        .target-line { position: absolute; bottom: 50px; width: 100%; height: 10px; background-color: #e74c3c; box-shadow: 0 0 10px #e74c3c; }

        .note {
            position: absolute; top: -30px; left: 50%; transform: translateX(-50%); width: 80px; height: 20px;
            background-color: #34dbcc; border-radius: 5px; box-shadow: 0 0 10px #34dbcc;
            animation-name: dropNote; animation-timing-function: linear; animation-fill-mode: forwards;
        }

        @keyframes dropNote { 0% { top: -30px; } 100% { top: 450px; } }

        .hit-effect {
            position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%); color: #f1c40f;
            font-size: 28px; font-weight: bold; pointer-events: none; animation: fadeOut 0.5s forwards;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        @keyframes fadeOut { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); } }
        #scoreBoard { font-size: 24px; font-weight: bold; margin-bottom: 10px; }
        
        #difficultySelector {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 100%; text-align: center; z-index: 10;
        }

        #gameOverScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85); color: white;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 20;
        }

        #playerNameInput {
            padding: 10px; font-size: 16px; border-radius: 5px; border: none; margin: 15px 0; text-align: center; width: 80%;
        }

        #rankingBoard {
            max-width: 300px; margin: 20px auto; background: #ecf0f1; padding: 20px; border-radius: 10px; text-align: left;
        }
        
        .ranking-item {
            display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #bdc3c7; font-weight: bold;
        }
        .ranking-item:last-child { border-bottom: none; }
    </style>
</head>
<body>

    <header>
        <h1>우리들의 놀이터</h1>
    </header>

    <nav>
        <button onclick="showSection('home')">홈</button>
        <button onclick="showSection('bab')">밥</button>
        <button onclick="showSection('fortune')">운세</button>
        <button onclick="showSection('game')">리듬게임</button>
    </nav>

    <div id="home" class="content-section">
        <h2>제작자 -이건우, 이현성, 장성현-</h2>
        <p>AI를 이용한 웹페이지 연구중, 원하는 기능 문의 바람 제발요</p>
    </div>

    <div id="bab" class="content-section hidden">
        <h2>오늘 뭐 먹지?</h2>
        <button class="action-btn" onclick="recommendMenu()">메뉴 추천받기</button>
        <div id="result"></div>
    </div>

    <div id="fortune" class="content-section hidden">
        <h2>오늘의 운세 뽑기 🥠</h2>
        <button class="action-btn fortune-btn" onclick="drawFortune()">운세 확인하기</button>
        <div id="fortuneResult"></div>
    </div>

    <div id="game" class="content-section hidden">
        <h2>미니 리듬게임 🎵</h2>
        <p>노트가 <b>빨간 선</b>에 닿을 때 <b>스페이스바</b>를 누르거나 <b>화면을 터치</b>하세요!</p>
        <div id="scoreBoard">점수: <span id="gameScore">0</span></div>
        
        <div id="gameArea">
            <div class="target-line" id="targetLine"></div>
            
            <div id="difficultySelector">
                <p style="color: white; margin-top: 0; margin-bottom: 10px; font-weight: bold;">난이도를 선택하세요</p>
                <button class="action-btn btn-easy" onclick="startRhythmGame('쉬움')">쉬움</button>
                <button class="action-btn btn-normal" onclick="startRhythmGame('보통')">보통</button><br>
                <button class="action-btn btn-hard" onclick="startRhythmGame('어려움')">어려움</button>
            </div>

            <div id="gameOverScreen" class="hidden">
                <h2 style="margin: 0; color: #f1c40f;">GAME OVER</h2>
                <p>최종 점수: <span id="finalScoreDisplay">0</span>점</p>
                <input type="text" id="playerNameInput" placeholder="이름을 입력하세요" maxlength="6">
                <button class="action-btn" style="padding: 10px 20px; font-size: 16px; margin-top: 0;" onclick="saveRankingToFirebase()">랭킹 등록하기</button>
            </div>
        </div>

        <div id="rankingBoard">
            <h3 style="margin-top: 0; text-align: center; color: #2c3e50;">🏆 실시간 명예의 전당 (Top 5) 🏆</h3>
            <div id="rankingList">랭킹을 불러오는 중...</div>
        </div>
    </div>

    <script>
        // ==========================================
        // 🔑 [중요] 파이어베이스 열쇠 입력 구간
        // 아래의 firebaseConfig 변수 내용을 파이어베이스에서 복사해 온 본인의 코드로 교체하세요!
        // ==========================================
        const firebaseConfig = {
           apiKey: "AIzaSyAix77Hg9-cy4IIrvDooGjEdEKGxznq0Js",
    authDomain: "ranking-6a455.firebaseapp.com",
    projectId: "ranking-6a455",
    storageBucket: "ranking-6a455.firebasestorage.app",
    messagingSenderId: "999663440482",
    appId: "1:999663440482:web:c04cd428b5cea5039fb73b"
        };

        // 파이어베이스 초기화 및 데이터베이스(db) 연결
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();


        // --- 1. 화면 전환 기능 ---
        function showSection(sectionId) {
            document.querySelectorAll('.content-section').forEach(section => section.classList.add('hidden'));
            document.getElementById(sectionId).classList.remove('hidden');
            if(sectionId === 'game') fetchRankings(); // 게임 탭 열 때 실시간 서버 랭킹 불러오기
        }

        // --- 2. 밥 & 운세 기능 ---
        const foodList = [
            "김치찌개": "돼지고기나 참치가 들어간 얼큰하고 진한 국물 요리", 
            "된장찌개": "구수한 된장에 두부, 호박, 감자를 넣은 전통 찌개", 
            "순두부찌개": "부드러운 순두부와 해물 또는 고기가 들어간 칼칼한 찌개", 
            "부대찌개": "햄, 소시지, 라면 사리를 넣어 끓인 얼큰한 찌개", 
            "제육볶음": "매콤한 양념장에 돼지고기를 야채와 함께 볶은 요리", 
            "불고기": "얇게 썬 소고기를 간장 양념에 재워 달콤하게 볶거나 전골로 먹는 요리", 
            "갈비탕": "갈비를 고아 맑고 진하게 우려낸 국물 요리", 
            "설렁탕 /곰탕": "사골이나 양지를 오랜 시간 고아 낸 뽀얗고 담백한 국물 요리", 
            "삼계탕": "닭 한 마리에 인삼, 대추, 찹쌀을 채워 넣고 끓인 보양식", 
            "육개장": "푹 끓인 소고기와 고사리, 대파를 넣은 얼큰한 국물 요리", 
            "청국장": "꼬릿한 냄새와 함께 구수한 맛이 일품인 콩 찌개", 
            "동태찌개": "얼린 명태와 무, 쑥갓을 넣어 시원하게 끓인 국물 요리", 
            "간장게장 / 양념게장": "신선한 꽃게를 간장이나 매콤한 양념에 재운 밥도둑 메뉴", 
            "생선구이 (고등어, 임연수, 갈치)": "노릇하게 구워내 밥반찬으로 훌륭한 메뉴", 
            "짜장면": "달콤 짭조름한 춘장 소스에 비벼 먹는 대표 중식 메뉴", 
            "짬뽕": "얼큰하고 시원한 해물 국물에 면을 말아 먹는 중식 메뉴", 
            "탕수육": "바삭하게 튀긴 돼지고기에 새콤달콤한 소스를 곁들이는 요리", 
            "볶음밥": "밥을 야채, 계란과 함께 고슬고슬하게 볶아낸 요리", 
            "칼국수": "멸치나 닭 육수에 쫄깃한 면발을 끓여낸 요리", 
            "콩국수": "시원하고 진한 콩물에 면을 말아 먹는 여름철 별미", 
            "잔치국수": "멸치 육수에 얇은 소면을 말고 김가루를 얹어 먹는 국수", 
            "물냉면 / 비빔냉면": "시원한 육수나 매콤한 양념장에 면을 비벼 먹는 면 요리", 
            "막국수": "메밀면을 김가루, 양념장 또는 동치미 국물과 곁들여 먹는 요리", 
            "라면": "언제 어디서나 간편하게 끓여 먹는 국민 간편식", 
            "마라탕 / 마라샹궈": "얼얼하고 매콤한 마라 소스에 채소와 고기를 넣어 끓이거나 볶은 요리", 
            "쌀국수": "맑고 깊은 육수에 얇은 쌀국수 면을 담아 먹는 아시안 요리", 
            "삼겹살 / 목살": "국내 외식 메뉴 부동의 1위, 지글지글 구워 먹는 돼지고기", 
            "소고기 구이 (등심, 갈비살 등)": "특별한 날이나 회식 때 즐겨 먹는 소고기", 
            "닭갈비": "매콤한 양념에 닭고기, 양배추, 떡을 철판에 볶아 먹는 요리", 
            "곱창구이 / 막창구이 / 대창구이": "쫄깃한 식감과 고소한 맛이 특징인 내장 구이", 
            "족발 / 보쌈": "야들야들하게 삶아낸 돼지고기를 쌈 야채와 곁들여 먹는 메뉴", 
            "닭볶음탕": "닭고기와 감자, 당근을 매콤한 양념에 졸여낸 요리", 
            "양꼬치": "향신료를 발라 숯불에 구워 먹는 양고기 구이", 
            "떡볶이": "매콤달콤한 양념에 쌀떡이나 밀떡을 졸여낸 국민 분식", 
            "김밥": "밥과 각종 속재료를 김에 돌돌 말아 썰어 먹는 메뉴", 
            "튀김 (오징어, 김말이, 야채 등)": "바삭하게 튀겨내 떡볶이 국물에 찍어 먹는 메뉴", 
            "순대": "찹쌀이나 당면을 채워 넣어 쪄낸 소시지 형태의 분식", 
            "라면+김밥 세트": "분식집에서 가장 흔하게 조합해 먹는 정석 메뉴", 
            "토스트 / 샌드위치": "간단하게 아침이나 간식으로 먹는 빵 요리", 
            "햄버거 세트": "패티와 야채가 들어간 빵과 감자튀김, 콜라 조합", 
            "피자": "치즈와 다양한 토핑을 얹어 오븐에 구워낸 요리", 
            "치킨 (후라이드, 양념, 반반)": "바삭한 닭 튀김으로 야식과 모임의 대표 메뉴", 
            "돈가스": "바삭하게 튀긴 돼지고기 커틀릿에 소스를 얹어 먹는 요리", 
            "파스타 / 리조또": "토마토, 크림, 오일 등 다양한 소스로 맛을 낸 이탈리안 요리", 
            "오므라이스": "볶음밥을 얇은 계란 지단으로 감싼 요리", 
            "카레라이스": "향신료 카레 가루에 고기와 야채를 볶아 밥에 비벼 먹는 요리", 
            "초밥 (스시)": "신선한 생선회와 밥을 쥐여 만든 일식 메뉴", 
            "규동 / 돈부리": "밥 위에 소고기나 돈가스, 계란을 얹어 먹는 덮밥류", 
            "라멘": "진한 돈코츠나 쇼유 육수에 생면을 넣은 일본식 라면", 
            "타코야끼 / 오코노미야끼": "밀가루 반죽에 문구나 양배추를 넣어 철판에 구워낸 요리", 
            "샌드위치 / 샐러드": "가볍게 한 끼를 때우기 좋은 다이어트 및 브런치 메뉴", 
            "포케": "신선한 해산물과 야채를 밥이나 곡물과 함께 비벼 먹는 건강식"
        ];
        function recommendMenu() {
            const randomIndex = Math.floor(Math.random() * foodList.length);
            document.getElementById('result').innerText = `추천 메뉴: ${foodList[randomIndex]}! 😋`;
        }

        const fortuneData = [
            { result: "대길 (大吉) 🌟", comment: "오늘 하는 일마다 술술 풀릴 거예요." },
            { result: "중길 (中吉) ✨", comment: "평온하고 안정적인 하루입니다." },
            { result: "소길 (小吉) 🍀", comment: "소소한 행운이 찾아옵니다." },
            { result: "주의 (注意) 🌧️", comment: "신중하게 행동하면 좋은 하루가 될 거예요." }
        ];
        function drawFortune() {
            const randomIndex = Math.floor(Math.random() * fortuneData.length);
            const selected = fortuneData[randomIndex];
            document.getElementById('fortuneResult').innerHTML = `<div style="font-size: 32px; font-weight: bold; color: #8e44ad; margin-bottom: 15px;">${selected.result}</div><div style="font-size: 18px; color: #555;">${selected.comment}</div>`;
        }

        // --- 3. 미니 리듬게임 & 서버 랭킹 기능 ---
        let score = 0;
        let gameInterval;
        let isGameRunning = false;
        let currentDropSpeed = '2s';
        let currentPlayedDifficulty = ''; 

        const gameArea = document.getElementById('gameArea');
        const targetLine = document.getElementById('targetLine');
        const difficultySelector = document.getElementById('difficultySelector');
        const gameOverScreen = document.getElementById('gameOverScreen');

        function startRhythmGame(difficulty) {
            if (isGameRunning) return;
            isGameRunning = true;
            currentPlayedDifficulty = difficulty;
            
            difficultySelector.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            
            score = 0;
            document.getElementById('gameScore').innerText = score;
            document.getElementById('playerNameInput').value = '';
            
            let spawnRate = 1000;
            if (difficulty === '쉬움') { spawnRate = 1200; currentDropSpeed = '2.5s'; } 
            else if (difficulty === '보통') { spawnRate = 800; currentDropSpeed = '1.5s'; } 
            else if (difficulty === '어려움') { spawnRate = 450; currentDropSpeed = '0.9s'; }

            gameInterval = setInterval(createNote, spawnRate);
            setTimeout(stopRhythmGame, 15000); // 15초 후 종료
        }

        function createNote() {
            const note = document.createElement('div');
            note.classList.add('note');
            note.style.animationDuration = currentDropSpeed;
            note.addEventListener('animationend', () => { if(note.parentNode) note.remove(); });
            gameArea.appendChild(note);
        }

        function stopRhythmGame() {
            clearInterval(gameInterval);
            isGameRunning = false;
            document.querySelectorAll('.note').forEach(n => n.remove());
            
            document.getElementById('finalScoreDisplay').innerText = score;
            gameOverScreen.classList.remove('hidden');
        }

        // 🌟 [서버 연동] 구글 Firestore 서버에 점수 저장하기
        function saveRankingToFirebase() {
            let playerName = document.getElementById('playerNameInput').value.trim();
            if (playerName === "") playerName = "익명";

            // 파이어베이스 'rankings'라는 이름의 데이터 창고에 데이터 추가
            db.collection("rankings").add({
                name: playerName,
                score: score,
                difficulty: currentPlayedDifficulty,
                timestamp: firebase.firestore.FieldValue.serverTimestamp() // 저장된 시간 순서용
            })
            .then(() => {
                gameOverScreen.classList.add('hidden');
                difficultySelector.classList.remove('hidden');
                fetchRankings(); // 저장 직후 최신 랭킹 다시 불러오기
                alert("서버에 랭킹이 성공적으로 등록되었습니다!");
            })
            .catch((error) => {
                console.error("랭킹 저장 중 에러 발생: ", error);
                alert("랭킹 저장에 실패했습니다.");
            });
        }

        // 🌟 [서버 연동] 구글 Firestore 서버에서 상위 5개 랭킹 가져와서 화면에 띄우기
        function fetchRankings() {
            const rankingListDiv = document.getElementById('rankingList');
            rankingListDiv.innerText = "랭킹 불러오는 중...";

            // 점수(score)가 높은 순서대로 최대 5개 가져오기
            db.collection("rankings")
                .orderBy("score", "desc")
                .limit(5)
                .get()
                .then((querySnapshot) => {
                    if (querySnapshot.empty) {
                        rankingListDiv.innerText = "아직 등록된 랭킹이 없습니다.";
                        return;
                    }

                    let htmlString = "";
                    let index = 0;
                    
                    querySnapshot.forEach((doc) => {
                        let data = doc.data();
                        let medal = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : `${index + 1}위`;
                        
                        htmlString += `
                            <div class="ranking-item">
                                <span>${medal} ${data.name} <span style="font-size:12px; color:#7f8c8d;">(${data.difficulty})</span></span>
                                <span style="color:#e74c3c;">${data.score}점</span>
                            </div>
                        `;
                        index++;
                    });
                    
                    rankingListDiv.innerHTML = htmlString;
                })
                .catch((error) => {
                    console.error("랭킹을 불러오는 중 에러 발생: ", error);
                    rankingListDiv.innerText = "랭킹을 불러오지 못했습니다.";
                });
        }

        function checkHit() {
            if (!isGameRunning) return;
            const notes = document.querySelectorAll('.note');
            const targetRect = targetLine.getBoundingClientRect();
            let hitSuccess = false;

            notes.forEach(note => {
                const noteRect = note.getBoundingClientRect();
                if (noteRect.bottom >= targetRect.top - 30 && noteRect.top <= targetRect.bottom + 30) {
                    note.remove(); 
                    score += 10;
                    document.getElementById('gameScore').innerText = score;
                    showHitEffect("PERFECT!");
                    hitSuccess = true;
                }
            });

            if (!hitSuccess) showHitEffect("MISS!");
        }

        function showHitEffect(text) {
            const effect = document.createElement('div');
            effect.classList.add('hit-effect');
            effect.innerText = text;
            if(text === "MISS!") effect.style.color = "#e74c3c";
            gameArea.appendChild(effect);
            setTimeout(() => { if(effect.parentNode) effect.remove(); }, 500);
        }

        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('game').classList.contains('hidden') && e.code === 'Space') {
                e.preventDefault();
                checkHit();
            }
        });

        gameArea.addEventListener('pointerdown', (e) => {
            if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'INPUT' && !gameOverScreen.contains(e.target)) {
                checkHit();
            }
        });
    </script>

</body>
</html>
