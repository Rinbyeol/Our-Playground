<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 다기능 웹페이지</title>
    <style>
        /* 기본 스타일 설정 */
        body {
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
        }

        /* 상단 헤더 영역 */
        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        /* 네비게이션 메뉴 (버튼들이 들어갈 곳) */
        nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 15px;
            background-color: #ecf0f1;
        }

        nav button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.2s;
        }

        nav button:hover {
            background-color: #2980b9;
        }

        /* 각 기능이 보여질 메인 콘텐츠 영역 */
        .content-section {
            background: white;
            max-width: 600px;
            margin: 30px auto;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        /* 화면을 숨기는 데 사용할 클래스 */
        .hidden {
            display: none;
        }

        /* 밥 메뉴 전용 스타일 */
        .action-btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            transition: background-color 0.2s;
        }

        .action-btn:hover {
            background-color: #c0392b;
        }

        #result {
            margin-top: 30px;
            font-size: 28px;
            font-weight: bold;
            color: #27ae60;
        }
    </style>
</head>
<body>

    <header>
        <h1>나만의 다기능 웹툴</h1>
    </header>

    <!-- 네비게이션: 여기에 새로운 메뉴 버튼을 계속 추가할 수 있습니다 -->
    <nav>
        <button onclick="showSection('home')">홈</button>
        <button onclick="showSection('bab')">밥</button>
        <!-- 예시: <button onclick="showSection('game')">게임</button> -->
    </nav>

    <!-- 1. 홈 화면 (기본 화면) -->
    <div id="home" class="content-section">
        <h2>환영합니다!</h2>
        <p>상단 메뉴를 클릭하여 원하는 기능을 사용해 보세요.</p>
        <p>앞으로 이곳에 유용한 기능들이 계속 추가될 예정입니다.</p>
    </div>

    <!-- 2. '밥' 화면 -->
    <div id="bab" class="content-section hidden">
        <h2>오늘 뭐 먹지?</h2>
        <p>아래 버튼을 누르면 오늘의 식사 메뉴를 추천해 드립니다.</p>
        <button class="action-btn" onclick="recommendMenu()">Menu</button>
        <div id="result"></div>
    </div>

    <!-- 3. 새로운 기능을 추가하려면 여기에 <div class="content-section hidden"> 을 만드세요 -->

    <script>
        // --- 1. 화면 전환 기능 ---
        // 상단 메뉴 버튼을 누르면 해당 화면만 보여주고 나머지는 숨깁니다.
        function showSection(sectionId) {
            // 모든 콘텐츠 섹션을 찾아서 'hidden' 클래스를 추가(숨김)
            document.querySelectorAll('.content-section').forEach(section => {
                section.classList.add('hidden');
            });
            
            // 전달받은 ID의 섹션만 'hidden' 클래스를 제거(보여줌)
            document.getElementById(sectionId).classList.remove('hidden');
        }

        // --- 2. 랜덤 메뉴 추천 기능 ---
        const foodList = [
            "제육볶음", "김치찌개", "돈까스", "짜장면", 
            "초밥", "햄버거", "국밥", "마라탕", 
            "피자", "샌드위치", "비빔밥", "냉면",
            "칼국수", "샐러드", "카레", "쌀국수"
        ];

        function recommendMenu() {
            // 0부터 (foodList 길이 - 1) 사이의 랜덤한 숫자를 뽑습니다.
            const randomIndex = Math.floor(Math.random() * foodList.length);
            const selectedMenu = foodList[randomIndex];
            
            // 결과를 화면에 표시합니다.
            document.getElementById('result').innerText = `추천 메뉴: ${selectedMenu}! 😋`;
        }
    </script>

</body>
</html>
